# Minimal config for AoE's private `tmux -L aoe` server.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:extkeys,ghostty:RGB:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on
set -g allow-passthrough on
set -g mouse on
set -g prefix C-b
bind-key C-b send-prefix

# AoE agents run in the separate `-L aoe` server. C-q detaches that nested
# client so the parent AoE dashboard regains control.
set-hook -g client-attached 'if-shell -F "#{m:aoe_*,#{session_name}}" "switch-client -T aoe-agent"'
bind-key -T aoe-agent C-b switch-client -T prefix
bind-key -T aoe-agent C-q detach-client
