# Minimal config for AoE's private `tmux -L aoe` server.
set -g default-terminal "tmux-256color"
# A nested tmux client must not request extended keys from its outer tmux.
# Otherwise the outer layer encodes pasted LF bytes as CSI-u (`[106;5u`).
# The explicit S-Enter bridge still carries multiline input into AoE.
set -as terminal-features ',xterm*:RGB:extkeys,ghostty:RGB:extkeys,tmux*:extkeys@'
set -s extended-keys off
set -s extended-keys-format csi-u
set -g focus-events on
set -g allow-passthrough on
set -g mouse on
set-window-option -g mode-keys vi
# Match the main server: a mouse selection goes to the macOS clipboard, not
# only tmux's private paste buffer.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
set -g prefix C-b
bind-key C-b send-prefix
bind-key -n F12 send-keys -H 1b 5b 31 33 3b 32 75
# AoE agents run in the separate `-L aoe` server. Use root table: custom key
# tables return to root after ordinary input, which made C-q work only once.
set-hook -gu client-attached
bind-key -n C-q if-shell -F '#{m:aoe_*,#{session_name}}' detach-client 'send-keys C-q'
