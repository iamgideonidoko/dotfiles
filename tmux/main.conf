##############################################################################
# DO_NOT_BACK_UP_FILE
##############################################################################
# Prerequisites
# Install Tmux Package Manager (TPM). This is installed by default in the .zshrc file.
##############################################################################

# NOTE:
# Mission control on Mac can alter the default tmux resize page binding
# Input sources keyboard shortcut can also alter the tmux binding

##############################################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:extkeys,ghostty:RGB:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events on


# Enable image preview to work correctly in tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off
set-option -g allow-rename off
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}"

# Enable mouse support
set -g mouse on

# Rose Pine popup chrome. `bg=default` preserves terminal transparency.
set -g popup-style "fg=#e0def4,bg=default"
set -g popup-border-style "fg=#c4a7e7,bg=default"
set -g popup-border-lines rounded
set-environment -g TMUX_FZF_OPTIONS "-p -w 62% -h 38% -m --border=rounded --color=bg+:#26233a,fg:#e0def4,fg+:#e0def4,hl:#eb6f92,hl+:#eb6f92,border:#c4a7e7,prompt:#9ccfd8,pointer:#f6c177,marker:#ebbcba,header:#908caa,spinner:#eb6f92,info:#908caa"

# Normal tmux uses Ctrl-Space.
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g detach-on-destroy off
##############################################################################
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_ORDER="window|session|pane|command|keybinding|clipboard|process"
TMUX_FZF_WINDOW_FORMAT="#{window_index}: #{b:pane_current_path} (#{pane_current_command})"
##############################################################################
##############################################################################
# Theme
set -g @rose_pine_variant 'main'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_show_pane_directory 'on'
set -g @rose_pine_status_left_append_section '  '
set-option -g status-position top
##############################################################################
# Set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
##############################################################################
# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Open windows in current directory, next to current win
bind c new-window -a -c "#{pane_current_path}"
# Move windows left and right
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1
# Shift Alt H & L keys to switch windows left and right
bind -n C-S-H previous-window
bind -n C-S-L next-window
# Toggle the status bar (prefix + t)
bind _ set-option -g status
# Resize panes using prefix + Alt + arrow
bind -r h resize-pane -L 6
bind -r l resize-pane -R 5
bind -r k resize-pane -U 5
bind -r j resize-pane -D 5
bind-key C-Space run-shell -b "#{TMUX_PLUGIN_MANAGER_PATH}/tmux-fzf/scripts/window.sh switch"
bind-key k run-shell -b "bash ~/dotfiles/tmux/notes-popup-open.sh '#{socket_path}' '#{client_tty}' '#{pane_current_path}'"
# Ctrl-Space a reveals/hides persistent AoE dashboard.
bind-key a run-shell -b "bash ~/dotfiles/tmux/aoe-popup-open.sh '#{socket_path}' '#{client_tty}' '#{pane_current_path}'"
##############################################################################

# Main-server Resurrect automation. Do not use Continuum: it skips work when
# private AoE or notes tmux servers already exist.
set -gu @continuum-restore
set -gu @continuum-save-interval
set -g @dotfiles-resurrect-save-interval '5'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# Ensure plugins are installed (you can install plugins manually with prefix (C-Space) + I)
run '~/.tmux/plugins/tpm/bin/install_plugins'
run-shell -b 'bash ~/dotfiles/tmux/resurrect-restore.sh "#{socket_path}"'
run-shell -b 'bash ~/dotfiles/tmux/resurrect-status.sh "#{socket_path}"'
