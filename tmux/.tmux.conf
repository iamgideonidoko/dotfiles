# TPM scans this file for plugins; it cannot follow source-file inside if-shell.
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin 'rose-pine/tmux'

# AoE and notes use private tmux servers with no plugins.
if-shell -F "#{||:#{m:*/aoe,#{socket_path}},#{m:*/aoe-dashboard,#{socket_path}},#{m:*/notes,#{socket_path}}}" "source-file ~/dotfiles/tmux/aoe.conf" "source-file ~/dotfiles/tmux/main.conf"
